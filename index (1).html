<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sembrando Futuro · Alcaldía de Panamá</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* ============================================================
   DESIGN TOKENS — heredados del Lego Design System, Alcaldía de Panamá
   ============================================================ */
:root{
  --color-primary-50:#EDF7FF; --color-primary-100:#D6EAFF; --color-primary-200:#B5DCFF;
  --color-primary-300:#83C8FF; --color-primary-400:#48A9FF; --color-primary-500:#0660FF;
  --color-primary-600:#0046EF; --color-primary-700:#083AC5; --color-primary-800:#0D369B; --color-primary-900:#0E225D;
  --color-secondary-300:#83C8FF; --color-secondary-400:#48A9FF;
  --color-neutral-0:#FCFDFD; --color-neutral-50:#F4F6F7; --color-neutral-100:#D9D9D9;
  --color-neutral-200:#CAD2D7; --color-neutral-300:#A4B1BC; --color-neutral-400:#627485;
  --color-neutral-500:#4F5B6B; --color-neutral-600:#363B43; --color-neutral-900:#21252B;
  --color-lime-300:#84CC16; --color-lime-400:#65A30D;
  --color-cyan-300:#22D3EE; --color-cyan-400:#0EA5C6;
  --color-brown-300:#B45309;
  --color-success-100:#E6F6EC; --color-success-300:#7DDBA5; --color-success-500:#2ECC71; --color-success-700:#1E9E57;
  --color-warning-100:#FFF4E5; --color-warning-300:#FFD28A; --color-warning-500:#F59E0B; --color-warning-700:#B45309;
  --color-error-100:#FDECEA; --color-error-300:#F1998E; --color-error-500:#E53935; --color-error-700:#B71C1C;
  --color-info-100:#EDF7FF; --color-info-300:#83C8FF;

  --bg-base:var(--color-neutral-50); --bg-surface:var(--color-neutral-0); --bg-subtle:var(--color-primary-50); --bg-inverse:var(--color-primary-500);
  --fg-strong:var(--color-neutral-900); --fg-default:var(--color-neutral-600); --fg-muted:var(--color-neutral-400); --fg-disabled:var(--color-neutral-300); --fg-on-brand:#FFFFFF;
  --border-subtle:var(--color-neutral-100); --border-default:var(--color-neutral-200); --border-strong:var(--color-neutral-300);
  --action:var(--color-primary-500); --action-hover:var(--color-primary-600); --action-press:var(--color-primary-700); --action-subtle:var(--color-primary-50); --focus-ring:var(--color-primary-400); --link:var(--color-primary-600);

  --font-display:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-body:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

  --radius-xs:6px; --radius-sm:8px; --radius-md:12px; --radius-card:16px; --radius-lg:16px; --radius-xl:24px; --radius-pill:999px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;

  --shadow-xs:0 1px 2px rgba(14,34,93,.06);
  --shadow-sm:0 2px 8px rgba(14,34,93,.08);
  --shadow-md:0 6px 18px rgba(14,34,93,.10);
  --shadow-lg:0 14px 34px rgba(14,34,93,.16);
  --shadow-focus:0 0 0 3px rgba(72,169,255,.45);
}
@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500&display=swap');

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-base);font-family:var(--font-body);color:var(--fg-default);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
a{color:var(--link);text-decoration:none}
h1,h2,h3{font-family:var(--font-display);color:var(--fg-strong);margin:0}
p{margin:0}
button{cursor:pointer}
[hidden]{display:none !important}
::selection{background:var(--color-primary-200)}

/* ---------- LOADER ---------- */
#bootLoader{position:fixed;inset:0;background:var(--color-primary-900);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9999;color:#fff}
#bootLoader .emoji{font-size:44px;animation:sway 1.6s ease-in-out infinite}
#bootLoader .txt{font-size:13px;color:rgba(255,255,255,.7);letter-spacing:.02em}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

/* ---------- BUTTONS ---------- */
.btn{font:600 14px/1 var(--font-body);border-radius:var(--radius-pill);padding:11px 20px;border:2px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .12s,border-color .12s,transform .08s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--action);color:#fff}
.btn.primary:hover{background:var(--action-hover)}
.btn.secondary{background:#fff;color:var(--action);border-color:var(--action)}
.btn.secondary:hover{background:var(--action-subtle)}
.btn.ghost{background:transparent;color:var(--action);padding:11px 12px}
.btn.ghost:hover{background:var(--action-subtle)}
.btn.danger{background:#fff;color:var(--color-error-700);border-color:var(--color-error-300)}
.btn.danger:hover{background:var(--color-error-100)}
.btn.sm{padding:7px 14px;font-size:12.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border-default);background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.iconbtn:hover{background:var(--action-subtle);border-color:var(--action)}

/* ---------- PILLS / BADGES ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:700;border:1.5px solid;line-height:1.3}
.pill.planted{background:var(--color-success-100);color:var(--color-success-700);border-color:var(--color-success-300)}
.pill.pending{background:var(--color-warning-100);color:var(--color-warning-700);border-color:var(--color-warning-300)}
.pill.neutral{background:var(--color-primary-50);color:var(--color-primary-700);border-color:var(--color-primary-300)}
.pill.overdue{background:var(--color-error-100);color:var(--color-error-700);border-color:var(--color-error-300)}

/* ---------- FIELDS ---------- */
.field{margin-bottom:14px}
.field label{font-size:12px;font-weight:700;color:var(--fg-strong);display:block;margin-bottom:6px}
.field .hint{font-size:11px;color:var(--fg-muted);margin-top:5px}
.ctrl,select.ctrl,textarea.ctrl{width:100%;background:#fff;border:1.5px solid var(--border-default);border-radius:var(--radius-sm);padding:11px 13px;font-size:14.5px;color:var(--fg-strong);outline:0}
.ctrl:focus{border-color:var(--action);box-shadow:var(--shadow-focus)}
textarea.ctrl{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- CARDS ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-xs)}

/* ---------- TOAST ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--color-primary-900);color:#fff;padding:12px 20px;border-radius:var(--radius-pill);font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:6000;opacity:0;transition:opacity .2s,transform .2s;display:flex;align-items:center;gap:8px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============================================================
   TOPBAR
   ============================================================ */
.topbar{position:sticky;top:0;z-index:500;background:var(--color-primary-900);color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px;height:60px;box-shadow:var(--shadow-sm)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:16px;letter-spacing:-.01em}
.brand .lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(150deg,var(--color-lime-300),var(--color-success-500));display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.brand small{display:block;font-weight:600;font-size:10px;color:rgba(255,255,255,.55);letter-spacing:.02em;margin-top:1px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button{background:transparent;border:0;color:rgba(255,255,255,.68);font:600 13.5px var(--font-body);padding:9px 16px;border-radius:var(--radius-pill);display:flex;align-items:center;gap:7px}
.tabs button:hover{color:#fff;background:rgba(255,255,255,.08)}
.tabs button.active{background:#fff;color:var(--color-primary-700)}

/* ============================================================
   MAP VIEW
   ============================================================ */
.view-map{position:relative;height:calc(100vh - 60px)}
#mapContainer{position:absolute;inset:0;z-index:1;background:var(--color-neutral-100)}
.tree-marker{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;border:3px solid var(--color-success-500);box-shadow:var(--shadow-md);cursor:pointer}
.tree-marker.pending{border-color:var(--color-warning-500)}
.tree-marker:hover{transform:scale(1.08)}

.filterbar{position:absolute;top:16px;left:16px;z-index:400;width:290px;max-width:calc(100vw - 32px);background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-md);padding:16px}
.filterbar h3{font-size:13px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.filterbar .field{margin-bottom:10px}
.filterbar .field:last-child{margin-bottom:0}
.chipstatus{display:flex;gap:6px}
.chipstatus button{flex:1;border:1.5px solid var(--border-default);background:#fff;border-radius:var(--radius-pill);padding:8px 4px;font-size:11.5px;font-weight:700;color:var(--fg-muted)}
.chipstatus button.active[data-st="planted"]{background:var(--color-success-100);border-color:var(--color-success-500);color:var(--color-success-700)}
.chipstatus button.active[data-st="pending"]{background:var(--color-warning-100);border-color:var(--color-warning-500);color:var(--color-warning-700)}
.chipstatus button.active[data-st=""]{background:var(--color-primary-50);border-color:var(--action);color:var(--color-primary-700)}
.filtercount{margin-top:10px;font-size:11.5px;color:var(--fg-muted);text-align:center}

.legend{position:absolute;bottom:20px;left:16px;z-index:400;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:12px 16px;display:flex;gap:16px;font-size:12px;font-weight:600;color:var(--fg-default)}
.legend .it{display:flex;align-items:center;gap:7px}
.legend .dot{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--color-success-500)}
.legend .dot.pending{border-color:var(--color-warning-500)}

.mapcta{position:absolute;bottom:20px;right:16px;z-index:400}

/* ---------- SITE DETAIL SHEET ---------- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(14,34,93,.35);z-index:900}
.sheet{position:fixed;top:0;right:0;height:100%;width:420px;max-width:92vw;background:var(--bg-surface);z-index:901;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slideIn .22s ease}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.sheet-head{padding:20px 22px 16px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:flex-start;gap:12px}
.sheet-head .ic{width:46px;height:46px;border-radius:14px;background:var(--color-primary-50);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.sheet-head h2{font-size:18px;line-height:1.25}
.sheet-head .sub{font-size:12.5px;color:var(--fg-muted);margin-top:3px}
.sheet-body{padding:18px 22px;overflow:auto;flex:1}
.sheet-foot{padding:16px 22px;border-top:1px solid var(--border-subtle);display:flex;gap:10px}
.infoblock{margin-bottom:20px}
.infoblock .lbl{font:700 10.5px var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--fg-muted);margin-bottom:8px}
.treelist{display:flex;flex-direction:column;gap:6px}
.treerow{display:flex;justify-content:space-between;align-items:center;background:var(--bg-base);border-radius:var(--radius-sm);padding:8px 12px;font-size:13.5px}
.treerow b{color:var(--fg-strong);font-weight:700}
.maintbox{display:flex;gap:12px;align-items:flex-start;background:var(--bg-base);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:10px}
.maintbox .em{font-size:20px}
.maintbox .t{font-size:13px;font-weight:700;color:var(--fg-strong)}
.maintbox .d{font-size:12px;color:var(--fg-muted);margin-top:2px}

/* ---------- MODALS ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(14,34,93,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg-surface);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);width:520px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:660px}
.modal>form{display:flex;flex-direction:column;flex:1;min-height:0}
.modal-head{padding:20px 22px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;flex:none}
.modal-head h2{font-size:17px}
.modal-body{padding:22px;overflow:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border-subtle);display:flex;gap:10px;justify-content:flex-end;flex:none}
.closeX{width:32px;height:32px;border-radius:50%;border:0;background:var(--bg-base);color:var(--fg-muted);font-size:16px}
.closeX:hover{background:var(--color-error-100);color:var(--color-error-700)}

.treerowform{display:grid;grid-template-columns:1fr 90px 34px;gap:8px;margin-bottom:8px;align-items:center}
.rmtree{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border-default);background:#fff;color:var(--color-error-500);font-size:15px}
#pickMap{height:190px;border-radius:var(--radius-md);overflow:hidden;border:1.5px solid var(--border-default);margin-bottom:8px}

/* QR modal */
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
#qrCanvasHolder{background:#fff;padding:14px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}
.qrurl{font-size:11px;color:var(--fg-muted);word-break:break-all;background:var(--bg-base);padding:8px 10px;border-radius:8px;max-width:340px}

/* ============================================================
   ADMIN
   ============================================================ */
.view-admin{min-height:calc(100vh - 60px)}
.admin-wrap{max-width:1180px;margin:0 auto;padding:30px 22px 80px}

.loginwrap{max-width:380px;margin:80px auto;text-align:center}
.loginwrap .em{font-size:46px;margin-bottom:6px}
.loginwrap h2{font-size:22px;margin-bottom:4px}
.loginwrap p{font-size:13.5px;color:var(--fg-muted);margin-bottom:22px}
.loginwrap .card{padding:26px;text-align:left}
.loginerr{color:var(--color-error-700);font-size:12.5px;margin-top:8px;text-align:center}

.admin-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.admin-head h1{font-size:24px}
.admin-head p{font-size:13px;color:var(--fg-muted);margin-top:3px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{padding:18px 20px}
.kpi .n{font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--fg-strong)}
.kpi .l{font-size:12px;color:var(--fg-muted);font-weight:600;margin-top:2px}
.kpi .ic{font-size:18px;margin-bottom:8px}

.admin-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}
.panel{padding:20px 22px}
.panel h3{font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.panel .desc{font-size:12px;color:var(--fg-muted);margin-bottom:14px}
.chartfilter{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.chartfilter select{max-width:200px}
canvas{max-width:100%}

.alertlist{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto}
.alertitem{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}
.alertitem.overdue{background:var(--color-error-100);border-color:var(--color-error-300)}
.alertitem.soon{background:var(--color-warning-100);border-color:var(--color-warning-300)}
.alertitem.upcoming{background:var(--color-info-100);border-color:var(--color-info-300)}
.alertitem .em{font-size:18px}
.alertitem b{font-size:13px;color:var(--fg-strong);display:block}
.alertitem span{font-size:11.5px;color:var(--fg-default)}
.alertitem .when{margin-left:auto;font-size:11px;font-weight:800;flex:none;text-align:right}
.emptystate{text-align:center;padding:30px 10px;color:var(--fg-muted);font-size:13px}
.emptystate .em{font-size:30px;display:block;margin-bottom:8px}

.sitestoolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.sitestoolbar input{max-width:260px}
.sitestable{width:100%;border-collapse:collapse}
.sitestable th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-muted);padding:0 12px 10px;border-bottom:1px solid var(--border-subtle)}
.sitestable td{padding:12px;border-bottom:1px solid var(--border-subtle);font-size:13px;vertical-align:middle}
.sitestable tr:last-child td{border-bottom:0}
.sitestable .nm{font-weight:700;color:var(--fg-strong)}
.sitestable .sub{font-size:11.5px;color:var(--fg-muted)}
.rowactions{display:flex;gap:6px;justify-content:flex-end}

/* ============================================================
   QR STANDALONE (público, solo lectura)
   ============================================================ */
.qrpublic{min-height:100vh;background:var(--bg-base);display:flex;align-items:center;justify-content:center;padding:24px}
.qrpublic .card{max-width:460px;width:100%;padding:0;overflow:hidden}
.qrpublic .hero{background:linear-gradient(150deg,var(--color-primary-600),var(--color-primary-900));color:#fff;padding:26px 24px 22px;text-align:center}
.qrpublic .hero .em{font-size:38px;margin-bottom:6px}
.qrpublic .hero h1{color:#fff;font-size:19px}
.qrpublic .hero .sub{font-size:12px;color:rgba(255,255,255,.75);margin-top:4px}
.qrpublic .bd{padding:22px 24px 26px}
.qrpublic .notice{display:flex;align-items:center;gap:8px;background:var(--color-primary-50);border:1px solid var(--color-primary-200);border-radius:var(--radius-md);padding:10px 12px;font-size:11.5px;color:var(--color-primary-700);margin-top:18px}

/* ---------- RESPONSIVE ---------- */
@media(max-width:820px){
  .admin-grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .filterbar{width:calc(100vw - 32px)}
}
@media(max-width:560px){
  .tabs button span.lbl{display:none}
  .brand small{display:none}
  .sheet{width:100%}
  .row2{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div id="bootLoader"><div class="emoji">🌳</div><div class="txt">Cargando Sembrando Futuro…</div></div>
<div id="toast"></div>

<!-- ================= QR STANDALONE (público, solo lectura) ================= -->
<div id="qrStandalone" hidden></div>

<!-- ================= APP PRINCIPAL ================= -->
<div id="mainApp" hidden>
  <header class="topbar">
    <div class="brand"><div class="lg">🌳</div><div>Sembrando Futuro<small>Gestión Social · Alcaldía de Panamá</small></div></div>
    <nav class="tabs">
      <button data-action="go-view" data-view="map" id="tabMap"><span>🗺️</span><span class="lbl">Mapa público</span></button>
      <button data-action="go-view" data-view="admin" id="tabAdmin"><span>🔐</span><span class="lbl">Panel admin</span></button>
    </nav>
  </header>

  <main>
    <section id="viewMap" class="view-map">
      <div id="mapContainer"></div>

      <div class="filterbar">
        <h3>🔎 Filtrar plantaciones</h3>
        <div class="field">
          <label>Corregimiento</label>
          <select class="ctrl" id="fCorregimiento" data-action="filter-change"><option value="">Todos</option></select>
        </div>
        <div class="field">
          <label>Tipo de árbol</label>
          <select class="ctrl" id="fTree" data-action="filter-change"><option value="">Todos</option></select>
        </div>
        <div class="field">
          <label>Estado</label>
          <div class="chipstatus" id="fStatus">
            <button class="active" data-st="" data-action="filter-status">Todos</button>
            <button data-st="planted" data-action="filter-status">Plantado</button>
            <button data-st="pending" data-action="filter-status">Pendiente</button>
          </div>
        </div>
        <div class="filtercount" id="filterCount"></div>
      </div>

      <div class="legend">
        <div class="it"><div class="dot"></div>Ya plantado</div>
        <div class="it"><div class="dot pending"></div>Por plantar</div>
      </div>
    </section>

    <section id="viewAdmin" class="view-admin" hidden>
      <div id="adminDashboard" class="admin-wrap"></div>
    </section>
  </main>
</div>

<!-- ================= SITE DETAIL SHEET ================= -->
<div id="sheetRoot"></div>

<!-- ================= MODALS ================= -->
<div id="modalRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ============================================================
   SEMBRANDO FUTURO — Gestión Social, Alcaldía de Panamá
   ============================================================ */

/* ---------- CATÁLOGOS ---------- */
const CORREGIMIENTOS = [
  "24 de Diciembre","Alcalde Díaz","Ancón","Bella Vista","Betania","Calidonia",
  "Chilibre","Curundú","Don Bosco","Ernesto Córdoba Campos","Juan Díaz","Las Cumbres",
  "Las Garzas","Las Mañanitas","Pacora","Parque Lefevre",
  "Pedregal","Río Abajo","San Felipe","San Francisco","Santa Ana","Tocumen"
];

const TREE_TYPES = [
  "Roble","Guayacán","Cedro Espino","Corotú","Espavé","Almendro",
  "Cocobolo","Nance","Guácimo","Caoba","Ceiba","Higuerón","Guaba","Marañón",
  "Flamboyán","Tecoma","Reina de las Flores","Amador","Frutales","Casco de Vaca","Lluvia de Oro",
  "Por definir"
];

const MAINT_TYPES = ["Riego","Poda","Fertilización","Control de plagas","Reemplazo de tutor","Deshierbe / Limpieza"];

/* Emojis disponibles para representar tipos de árbol en el mapa y las fichas.
   El admin puede además agregar íconos propios (imágenes PNG) desde el panel. */
const TREE_EMOJIS = [
  "🌳","🌲","🌴","🌵","🎄","🌱","🌿","☘️","🍀","🎋",
  "🎍","🪴","🪵","🌾","🍂","🍁","🌰","🥥","🌸","💐"
];
const DEFAULT_TREE_ICON = "🌳";

const MONTHS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

/* ---------- ESTADO ---------- */
const state = {
  sites: [],
  filters: { corregimiento: "", treeType: "", status: "" },
  view: "map",
  map: null,
  markersLayer: null,
  chart: null,
  typeChart: null,
  pickMap: null,
  pickMarker: null,
  editingSite: null, // {..site fields, trees:[{type,qty,icon}]} while form open
  editingId: null,
  siteSearch: "",
  customIcons: [], // [{id, name, dataUrl}] íconos PNG subidos por el admin
  openIconPickerIdx: null, // índice de la fila de árbol cuyo selector de emoji está abierto
  editingMaintType: MAINT_TYPES[0] // valor recordado del mini-formulario de historial de mantenimiento
};

/* ---------- SEMILLA DE DATOS DE EJEMPLO ---------- */
/* Programación real de siembras/resiembras 2026. Cuando un sitio tiene más
   de una especie, la cantidad total se reparte en partes iguales entre las
   especies indicadas (el reparto exacto se puede ajustar luego por sitio).
   Coordenadas exactas proporcionadas por Gestión Social. */
function seedSites(){
  const rows = [
    { place:"Isleta frente al aeropuerto de Ancón (Resiembra)", corregimiento:"Ancón", qty:100,
      species:["Guayacán","Flamboyán"], lat:8.965222, lng:-79.558972 },
    { place:"Isleta a un costado del Domo de la Universidad de Panamá (Resiembra)", corregimiento:"Ancón", qty:100,
      species:["Tecoma","Reina de las Flores","Amador"], lat:8.981333, lng:-79.546750 },
    { place:"Hiedra y bambú (Resiembra)", corregimiento:"Parque Lefevre", qty:75,
      species:["Tecoma","Reina de las Flores","Amador","Flamboyán"], lat:9.014839139775964, lng:-79.48012018715075 },
    { place:"Isleta frente al tribunal electoral de Ancón", corregimiento:"Ancón", qty:75,
      species:["Frutales"], lat:8.965917, lng:-79.546722 },
    { place:"Isleta principal de Santa Sofía", corregimiento:"Pacora", qty:200,
      species:["Amador"], lat:9.118973217626964, lng:-79.33254457374663 },
    { place:"Alrededores de la Ciudad de la Salud", corregimiento:"Ancón", qty:400,
      species:["Guayacán"], lat:9.031333, lng:-79.582583 },
    { place:"Parque Colinas de Pacora", corregimiento:"Pacora", qty:100,
      species:["Tecoma","Amador"], lat:9.085110215874993, lng:-79.29740247301417 },
    { place:"Parques de San Juan", corregimiento:"Pacora", qty:100,
      species:["Tecoma","Amador"], lat:9.089182891288738, lng:-79.30287646622271 },
    { place:"Parque Praderas de San Lorenzo", corregimiento:"Alcalde Díaz", qty:150,
      species:["Casco de Vaca","Lluvia de Oro","Guayacán"], lat:9.148361, lng:-79.542361 },
    { place:"Isleta central de la Morelos hacia el aeropuerto (Resiembra)", corregimiento:"Tocumen", qty:100,
      species:["Guayacán"], lat:9.086278, lng:-79.384361 }
  ];

  return rows.map((r,i)=>{
    // Reparte la cantidad total en partes iguales entre las especies del sitio;
    // el residuo de la división se agrega a la primera especie de la lista.
    const n = r.species.length;
    const base = Math.floor(r.qty / n);
    const extra = r.qty - base*n;
    const trees = r.species.map((sp,idx)=>({
      type: sp, qty: base + (idx===0 ? extra : 0), icon: DEFAULT_TREE_ICON
    }));
    return {
      id: "site-seed-"+i,
      name: r.place,
      corregimiento: r.corregimiento,
      lat: r.lat, lng: r.lng,
      status: "pending",
      plantingDate: todayISO(),
      trees,
      maintenanceHistory: [],
      nextMaintenance: null,
      notes: "",
      createdAt: new Date().toISOString()
    };
  });
}

/* ---------- ALMACENAMIENTO PERSISTENTE (compartido) ---------- */
async function loadSites(){
  try{
    const r = await window.storage.get("sf_sites", true);
    if(r && r.value) return JSON.parse(r.value);
  }catch(e){ /* no existe aún */ }
  return null;
}
async function saveSites(){
  try{
    await window.storage.set("sf_sites", JSON.stringify(state.sites), true);
  }catch(e){ toast("⚠️ No se pudo guardar (almacenamiento)"); }
}

/* Control de versión de los datos de siembra "de fábrica". Al subir la
   versión, la próxima carga reemplaza los datos guardados (por ejemplo, de
   pruebas o de una lista anterior) por la nueva programación de siembras,
   sin afectar ediciones futuras que el equipo haga después de esa carga. */
const SEED_DATA_VERSION = 4;
async function loadSeedVersion(){
  try{
    const r = await window.storage.get("sf_seed_version", true);
    if(r && r.value) return Number(r.value);
  }catch(e){ /* no existe aún */ }
  return 0;
}
async function saveSeedVersion(v){
  try{ await window.storage.set("sf_seed_version", String(v), true); }catch(e){ /* noop */ }
}

async function loadCustomIcons(){
  try{
    const r = await window.storage.get("sf_custom_icons", true);
    if(r && r.value) return JSON.parse(r.value);
  }catch(e){ /* no existe aún */ }
  return [];
}
async function saveCustomIcons(){
  try{
    await window.storage.set("sf_custom_icons", JSON.stringify(state.customIcons), true);
  }catch(e){ toast("⚠️ No se pudo guardar el ícono (almacenamiento)"); }
}

/* Resuelve un valor de ícono (emoji simple o "custom:<id>") a un HTML listo
   para insertar: un emoji tal cual, o un <img> si es un ícono PNG subido. */
function iconHTML(iconValue, sizePx){
  sizePx = sizePx || 22;
  if(iconValue && String(iconValue).indexOf("custom:")===0){
    const id = String(iconValue).slice(7);
    const found = state.customIcons.find(ic=>ic.id===id);
    if(found) return `<img src="${found.dataUrl}" alt="${esc(found.name||"ícono")}" style="width:${sizePx}px;height:${sizePx}px;object-fit:contain">`;
    return DEFAULT_TREE_ICON;
  }
  return esc(iconValue || DEFAULT_TREE_ICON);
}

/* Adapta datos guardados con versiones anteriores del sistema a la
   estructura actual (íconos por especie e historial de mantenimiento),
   sin perder la información que ya existía. */
function migrateSitesData(){
  let changed = false;
  state.sites.forEach(s=>{
    (s.trees||[]).forEach(t=>{
      if(!t.icon){ t.icon = DEFAULT_TREE_ICON; changed = true; }
    });
    if(!Array.isArray(s.maintenanceHistory)){
      s.maintenanceHistory = (s.lastMaintenance && s.lastMaintenance.date)
        ? [{ type: s.lastMaintenance.type, date: s.lastMaintenance.date }]
        : [];
      changed = true;
    }
  });
  if(changed) saveSites();
}

/* ---------- UTILIDADES ---------- */
function uid(){ return "site-"+Date.now()+"-"+Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear();
}
function daysDiff(iso){
  const d = new Date(iso+"T00:00:00");
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
function treeTotal(site){ return site.trees.reduce((s,t)=>s+Number(t.qty||0),0); }
/* Devuelve el registro de mantenimiento más reciente del historial, o null. */
function lastMaintenanceOf(site){
  const hist = site.maintenanceHistory || [];
  if(!hist.length) return null;
  return hist.reduce((a,b)=> (a.date>b.date ? a : b));
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove("show"), 2600);
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  // Registrar TODOS los listeners de eventos primero. Así, aunque algo
  // más abajo falle (por ejemplo, si el mapa o una librería externa no
  // carga), la app sigue respondiendo a los clics (pestañas, panel
  // admin, formularios, etc.) en vez de quedar completamente muerta.
  document.addEventListener("click", onGlobalClick);
  document.addEventListener("change", onGlobalChange);
  document.addEventListener("submit", onGlobalSubmit);
  document.addEventListener("input", onGlobalInput);
  document.addEventListener("keydown", (e)=>{ if(e.key==="Escape"){ closeSheet(); closeModal(); } });

  populateStaticSelects();

  const params = new URLSearchParams(location.search);
  const siteParam = params.get("site");

  let loaded = await loadSites();
  const storedSeedVersion = await loadSeedVersion();
  if(!loaded || storedSeedVersion !== SEED_DATA_VERSION){
    loaded = seedSites();
    state.sites = loaded;
    await saveSites();
    await saveSeedVersion(SEED_DATA_VERSION);
  } else {
    state.sites = loaded;
  }
  migrateSitesData();
  state.customIcons = await loadCustomIcons();

  document.getElementById("bootLoader").hidden = true;

  if(siteParam){
    renderQRStandalone(siteParam);
    document.getElementById("qrStandalone").hidden = false;
    return;
  }

  document.getElementById("mainApp").hidden = false;

  try{
    initMap();
    renderMarkers();
    renderFilterCount();
  }catch(err){
    console.error("No se pudo inicializar el mapa:", err);
    toast("⚠️ El mapa no se pudo cargar, pero el resto de la app sigue funcionando");
  }

  // Si el usuario cargó la página directamente en la pestaña de admin
  // (o ya estaba ahí por algún estado previo), aseguramos que se pinte.
  if(state.view==="admin") goView("admin");
}

function populateStaticSelects(){
  const fC = document.getElementById("fCorregimiento");
  CORREGIMIENTOS.forEach(c=>{
    const o = document.createElement("option"); o.value=c; o.textContent=c; fC.appendChild(o);
  });
  const fT = document.getElementById("fTree");
  TREE_TYPES.forEach(t=>{
    const o = document.createElement("option"); o.value=t; o.textContent=t; fT.appendChild(o);
  });
}

/* ============================================================
   NAVEGACIÓN DE VISTAS
   ============================================================ */
function goView(view){
  state.view = view;
  document.getElementById("viewMap").hidden = view!=="map";
  document.getElementById("viewAdmin").hidden = view!=="admin";
  document.getElementById("tabMap").classList.toggle("active", view==="map");
  document.getElementById("tabAdmin").classList.toggle("active", view==="admin");
  if(view==="map" && state.map){ setTimeout(()=>{ try{ state.map.invalidateSize(); }catch(e){} }, 60); }
  if(view==="admin"){
    renderAdminDashboard();
    document.getElementById("adminDashboard").hidden=false;
  }
}

/* ============================================================
   MAPA
   ============================================================ */
function initMap(){
  state.map = L.map("mapContainer", { zoomControl:false }).setView([9.02,-79.48], 12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(state.map);
  L.control.zoom({ position:"bottomright" }).addTo(state.map);
  state.markersLayer = L.layerGroup().addTo(state.map);
}

function siteMatchesFilters(s){
  const f = state.filters;
  if(f.corregimiento && s.corregimiento !== f.corregimiento) return false;
  if(f.status && s.status !== f.status) return false;
  if(f.treeType && !s.trees.some(t=>t.type===f.treeType)) return false;
  return true;
}

function renderMarkers(){
  if(!state.markersLayer) return;
  state.markersLayer.clearLayers();
  const filtered = state.sites.filter(siteMatchesFilters);
  filtered.forEach(site=>{
    const mainIcon = site.trees && site.trees.length ? site.trees[0].icon : DEFAULT_TREE_ICON;
    const icon = L.divIcon({
      className: "",
      html: `<div class="tree-marker ${site.status==='pending'?'pending':''}">${iconHTML(mainIcon,21)}</div>`,
      iconSize: [40,40], iconAnchor:[20,20]
    });
    const m = L.marker([site.lat, site.lng], { icon }).addTo(state.markersLayer);
    m.on("click", ()=>openSheet(site.id));
  });
  renderFilterCount(filtered.length);
}

function renderFilterCount(n){
  if(n===undefined) n = state.sites.filter(siteMatchesFilters).length;
  document.getElementById("filterCount").textContent = n + (n===1? " plantación encontrada" : " plantaciones encontradas");
}

/* ============================================================
   FICHA DE DETALLE (SHEET)
   ============================================================ */
function siteDetailHTML(site, opts){
  opts = opts || {};
  const statusPill = site.status==="planted"
    ? `<span class="pill planted">🟢 Plantado</span>`
    : `<span class="pill pending">🟠 Por plantar</span>`;

  const treesHTML = site.trees.length
    ? `<div class="treelist">${site.trees.map(t=>`<div class="treerow"><span>${iconHTML(t.icon,18)} ${esc(t.type)}</span><b>${esc(t.qty)} und.</b></div>`).join("")}</div>`
    : `<div class="hint">Sin especies registradas.</div>`;

  function maintHTML(m, emptyLabel){
    if(!m || !m.date) return `<div class="maintbox"><span class="em">—</span><div><div class="t">${emptyLabel}</div></div></div>`;
    return `<div class="maintbox"><span class="em">🛠️</span><div><div class="t">${esc(m.type)}</div><div class="d">${fmtDate(m.date)}</div></div></div>`;
  }

  return `
    <div class="infoblock">
      <div class="lbl">Estado y fecha</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${statusPill}
        <span class="pill neutral">📍 ${esc(site.corregimiento)}</span>
      </div>
      <div class="hint" style="margin-top:8px">
        ${site.status==="planted" ? "Plantado el " : "Fecha programada: "}<b style="color:var(--fg-strong)">${fmtDate(site.plantingDate)}</b>
      </div>
    </div>
    <div class="infoblock">
      <div class="lbl">Árboles plantados (${treeTotal(site)} en total)</div>
      ${treesHTML}
    </div>
    <div class="infoblock">
      <div class="lbl">Último mantenimiento</div>
      ${maintHTML(lastMaintenanceOf(site), "Sin registros aún")}
    </div>
    <div class="infoblock">
      <div class="lbl">Próximo mantenimiento</div>
      ${maintHTML(site.nextMaintenance, "No programado")}
    </div>
    ${site.notes ? `<div class="infoblock"><div class="lbl">Notas</div><div class="hint">${esc(site.notes)}</div></div>` : ""}
  `;
}

function openSheet(id){
  const site = state.sites.find(s=>s.id===id);
  if(!site) return;
  const root = document.getElementById("sheetRoot");
  const mainIcon = site.trees && site.trees.length ? site.trees[0].icon : DEFAULT_TREE_ICON;
  root.innerHTML = `
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet">
      <div class="sheet-head">
        <div class="ic">${iconHTML(mainIcon,26)}</div>
        <div style="flex:1">
          <h2>${esc(site.name)}</h2>
          <div class="sub">Ficha de la plantación</div>
        </div>
        <button class="closeX" data-action="close-sheet">✕</button>
      </div>
      <div class="sheet-body">${siteDetailHTML(site)}</div>
    </div>
  `;
}
function closeSheet(){ document.getElementById("sheetRoot").innerHTML=""; }

/* ============================================================
   QR
   ============================================================ */
function siteQRUrl(id){
  return location.origin + location.pathname + "?site=" + encodeURIComponent(id);
}

function openQRModal(id){
  const site = state.sites.find(s=>s.id===id);
  if(!site) return;
  const url = siteQRUrl(id);
  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-overlay" data-action="close-modal">
      <div class="modal">
        <div class="modal-head"><h2>📱 Código QR — ${esc(site.name)}</h2><button class="closeX" data-action="close-modal">✕</button></div>
        <div class="modal-body">
          <div class="qrwrap">
            <div id="qrCanvasHolder"></div>
            <div class="qrurl">${esc(url)}</div>
            <div class="hint">Cualquier persona que escanee este QR verá esta ficha en modo solo lectura, sin poder editar ni eliminar información.</div>
            <div style="display:flex;gap:10px;width:100%">
              <button class="btn secondary block" data-action="copy-qr-image">📋 Copiar imagen</button>
              <button class="btn secondary block" data-action="download-qr">⬇️ Descargar PNG</button>
            </div>
            <button class="btn ghost block" data-action="copy-qr-link">🔗 Copiar enlace</button>
          </div>
        </div>
      </div>
    </div>
  `;
  const holder = document.getElementById("qrCanvasHolder");
  try{
    new QRCode(holder, { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  }catch(err){
    console.error("Error generando QR:", err);
    holder.innerHTML = `<div class="hint">No se pudo generar el código QR (librería no disponible). El enlace sigue siendo válido y se puede copiar abajo.</div>`;
  }
  document.getElementById("modalRoot").dataset.qrUrl = url;
}

function closeModal(){ document.getElementById("modalRoot").innerHTML=""; }

async function copyQrImage(){
  const holder = document.getElementById("qrCanvasHolder");
  const canvas = holder.querySelector("canvas");
  if(!canvas){ toast("No se pudo generar la imagen"); return; }
  try{
    canvas.toBlob(async (blob)=>{
      try{
        await navigator.clipboard.write([ new ClipboardItem({ "image/png": blob }) ]);
        toast("✅ Imagen del QR copiada");
      }catch(e){
        toast("⚠️ Tu navegador no permite copiar imágenes. Usa 'Descargar PNG'.");
      }
    });
  }catch(e){ toast("⚠️ No se pudo copiar la imagen"); }
}
function downloadQr(){
  const holder = document.getElementById("qrCanvasHolder");
  const canvas = holder.querySelector("canvas");
  if(!canvas) return;
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "qr-sembrando-futuro.png";
  a.click();
}
async function copyQrLink(){
  const url = document.getElementById("modalRoot").dataset.qrUrl;
  try{ await navigator.clipboard.writeText(url); toast("🔗 Enlace copiado"); }
  catch(e){ toast("⚠️ No se pudo copiar el enlace"); }
}

/* ============================================================
   VISTA QR PÚBLICA (solo lectura, sin navegación)
   ============================================================ */
function renderQRStandalone(id){
  const root = document.getElementById("qrStandalone");
  const site = state.sites.find(s=>s.id===id);
  if(!site){
    root.innerHTML = `<div class="qrpublic"><div class="card"><div class="hero"><div class="em">🌳</div><h1>Sembrando Futuro</h1></div>
      <div class="bd"><p style="text-align:center;color:var(--fg-muted)">No encontramos esta plantación. El código QR puede haber cambiado o el enlace es incorrecto.</p></div></div></div>`;
    return;
  }
  root.innerHTML = `
    <div class="qrpublic">
      <div class="card">
        <div class="hero"><div class="em">🌳</div><h1>${esc(site.name)}</h1><div class="sub">Sembrando Futuro · Gestión Social, Alcaldía de Panamá</div></div>
        <div class="bd">
          ${siteDetailHTML(site)}
          <div class="notice">🔒 Vista pública de solo lectura. No es posible editar ni eliminar esta información desde aquí.</div>
        </div>
      </div>
    </div>
  `;
}

/* ============================================================
   ADMIN — DASHBOARD
   ============================================================ */
function computeKPIs(){
  const planted = state.sites.filter(s=>s.status==="planted");
  const pending = state.sites.filter(s=>s.status==="pending");
  const totalTrees = planted.reduce((s,x)=>s+treeTotal(x),0);
  const alerts = getMaintenanceAlerts();
  return { totalSites: state.sites.length, plantedCount: planted.length, pendingCount: pending.length, totalTrees, alertCount: alerts.filter(a=>a.kind!=="upcoming").length };
}

function getMaintenanceAlerts(){
  const items = [];
  state.sites.forEach(s=>{
    if(s.nextMaintenance && s.nextMaintenance.date){
      const d = daysDiff(s.nextMaintenance.date);
      let kind = "upcoming";
      if(d < 0) kind = "overdue";
      else if(d <= 5) kind = "soon";
      items.push({ site:s, date:s.nextMaintenance.date, type:s.nextMaintenance.type, days:d, kind });
    }
  });
  items.sort((a,b)=> a.days - b.days);
  return items;
}

function renderAdminDashboard(){
  const root = document.getElementById("adminDashboard");
  const k = computeKPIs();
  root.innerHTML = `
    <div class="admin-head">
      <div>
        <h1>Panel de Gestión Social</h1>
        <p>Seguimiento de plantaciones de árboles en el Distrito de Panamá</p>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn secondary" data-action="reset-demo">↺ Restablecer datos de ejemplo</button>
        <button class="btn primary" data-action="open-site-form">➕ Agregar plantación</button>
      </div>
    </div>

    <div class="kpis">
      <div class="card kpi"><div class="ic">🌳</div><div class="n">${k.totalTrees}</div><div class="l">Árboles plantados</div></div>
      <div class="card kpi"><div class="ic">📍</div><div class="n">${k.totalSites}</div><div class="l">Sitios registrados</div></div>
      <div class="card kpi"><div class="ic">🟢</div><div class="n">${k.plantedCount}</div><div class="l">Plantados</div></div>
      <div class="card kpi"><div class="ic">🟠</div><div class="n">${k.pendingCount}</div><div class="l">Por plantar</div></div>

/* Redimensiona una imagen subida a un tamaño manejable antes de guardarla,
   para no llenar el almacenamiento con imágenes pesadas. */
function resizeImageToDataURL(file, maxSize){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error("No se pudo leer el archivo"));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error("Imagen inválida"));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxSize/Math.max(w,h));
        w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/png"));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handleIconUpload(file){
  if(!file) return;
  if(file.type !== "image/png"){ toast("⚠️ Solo se aceptan imágenes PNG"); return; }
  try{
    const dataUrl = await resizeImageToDataURL(file, 64);
    state.customIcons.push({ id: uid(), name: file.name.replace(/\.png$/i,""), dataUrl });
    await saveCustomIcons();
    const grid = document.getElementById("customIconsGrid");
    if(grid) grid.innerHTML = customIconsGridHTML();
    toast("✅ Ícono agregado");
  }catch(err){
    console.error("Error subiendo ícono:", err);
    toast("⚠️ No se pudo procesar la imagen");
  }
}

function renderCorregimientoChart(){
  const canvas = document.getElementById("corregimientoChart");
  if(!canvas) return;
  const treeFilter = document.getElementById("chartTreeFilter") ? document.getElementById("chartTreeFilter").value : "";
  const totals = {};
  CORREGIMIENTOS.forEach(c=>totals[c]=0);
  state.sites.filter(s=>s.status==="planted").forEach(s=>{
    s.trees.forEach(t=>{
      if(treeFilter && t.type!==treeFilter) return;
      totals[s.corregimiento] = (totals[s.corregimiento]||0) + Number(t.qty||0);
    });
  });
  const entries = Object.entries(totals).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const labels = entries.map(e=>e[0]);
  const values = entries.map(e=>e[1]);

  if(state.chart) state.chart.destroy();
  if(!labels.length){
    const ctx = canvas.getContext("2d"); ctx.clearRect(0,0,canvas.width,canvas.height);
    return;
  }
  state.chart = new Chart(canvas, {
    type: "bar",
    data: { labels, datasets: [{ label: "Árboles plantados", data: values, backgroundColor: "#0660FF", borderRadius: 6, maxBarThickness: 34 }] },
    options: {
      responsive:true,
      plugins:{ legend:{ display:false } },
      scales:{ x:{ ticks:{ font:{ size:10.5 } }, grid:{ display:false } }, y:{ beginAtZero:true, ticks:{ precision:0 } } }
    }
  });
}

function renderTypeChart(){
  const canvas = document.getElementById("typeChart");
  if(!canvas) return;
  const totals = {};
  state.sites.filter(s=>s.status==="planted").forEach(s=>{
    s.trees.forEach(t=>{ totals[t.type] = (totals[t.type]||0) + Number(t.qty||0); });
  });
  const entries = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  const labels = entries.map(e=>e[0]);
  const values = entries.map(e=>e[1]);
  const palette = ["#0660FF","#22D3EE","#84CC16","#7C6AE6","#FB7185","#F59E0B","#48A9FF","#2ECC71","#B45309","#5B4BC4","#0EA5C6","#65A30D","#FDA4AF","#0046EF"];

  if(state.typeChart) state.typeChart.destroy();
  if(!labels.length) return;
  state.typeChart = new Chart(canvas, {
    type: "bar",
    data: { labels, datasets:[{ label:"Unidades", data: values, backgroundColor: labels.map((_,i)=>palette[i%palette.length]), borderRadius:6, maxBarThickness:28 }] },
    options: {
      indexAxis:"y",
      responsive:true,
      plugins:{ legend:{ display:false } },
      scales:{ x:{ beginAtZero:true, ticks:{ precision:0 } } }
    }
  });
}

function initPickMap(lat,lng){
  setTimeout(()=>{
    const el = document.getElementById("pickMap");
    if(!el) return;
    try{
      state.pickMap = L.map("pickMap", { zoomControl:false }).setView([lat,lng], 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:'&copy; OSM' }).addTo(state.pickMap);
      state.pickMarker = L.marker([lat,lng], { draggable:true }).addTo(state.pickMap);
      state.pickMarker.on("dragend", ()=>{
        const p = state.pickMarker.getLatLng();
        document.getElementById("f_lat").value = p.lat.toFixed(6);
        document.getElementById("f_lng").value = p.lng.toFixed(6);
      });
      state.pickMap.on("click", (e)=>{
        state.pickMarker.setLatLng(e.latlng);
        document.getElementById("f_lat").value = e.latlng.lat.toFixed(6);
        document.getElementById("f_lng").value = e.latlng.lng.toFixed(6);
      });
      setTimeout(()=>{ try{ state.pickMap.invalidateSize(); }catch(e){} }, 80);
    }catch(err){
      console.error("No se pudo cargar el mini-mapa de ubicación:", err);
      el.innerHTML = `<div class="hint" style="padding:10px">⚠️ El mini-mapa no cargó. Puedes escribir la latitud/longitud manualmente abajo.</div>`;
    }
  }, 30);
}

function saveSiteForm(){
  const s = state.editingSite;
  s.name = document.getElementById("f_name").value.trim() || "Plantación sin nombre";
  s.corregimiento = document.getElementById("f_corregimiento").value;
  s.status = document.getElementById("f_status").value;
  s.lat = parseFloat(document.getElementById("f_lat").value) || 9.02;
  s.lng = parseFloat(document.getElementById("f_lng").value) || -79.48;
  s.plantingDate = document.getElementById("f_plantingDate").value || todayISO();
  s.notes = document.getElementById("f_notes").value.trim();

  const nextDate = document.getElementById("f_nextMaintDate").value;
  s.nextMaintenance = nextDate ? { type: document.getElementById("f_nextMaintType").value, date: nextDate } : null;
  if(!Array.isArray(s.maintenanceHistory)) s.maintenanceHistory = [];

  s.trees = s.trees.filter(t=>t.type && Number(t.qty)>0);
  if(!s.trees.length) s.trees = [{ type: TREE_TYPES[0], qty: 1, icon: DEFAULT_TREE_ICON }];
  s.trees.forEach(t=>{ if(!t.icon) t.icon = DEFAULT_TREE_ICON; });

  if(state.editingId){
    const idx = state.sites.findIndex(x=>x.id===state.editingId);
    s.id = state.editingId;
    state.sites[idx] = s;
  } else {
    s.id = uid();
    s.createdAt = new Date().toISOString();
    state.sites.push(s);
  }
  saveSites();
  closeModal();
  renderMarkers();
  if(state.view==="admin") renderAdminDashboard();
  toast("✅ Plantación guardada");
}

/* ============================================================
   EVENTOS GLOBALES (delegación)
   ============================================================ */
function onGlobalClick(e){
  const t = e.target.closest("[data-action]");
  if(!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;

  switch(action){
    case "go-view": goView(t.dataset.view); break;
    case "close-sheet": closeSheet(); break;
    case "close-modal":
      // Si el elemento con data-action="close-modal" que se resolvió es el
      // fondo (overlay) pero el clic en realidad se originó en un elemento
      // hijo (inputs, selects, texto, etc. que burbujean hasta el overlay),
      // no cerramos: solo cerramos si el clic fue directamente sobre el
      // fondo, sobre la X, o sobre el botón "Cancelar".
      if(t.classList.contains("modal-overlay") && e.target !== t) break;
      closeModal();
      break;
    case "open-qr": e.stopPropagation(); openQRModal(id); break;
    case "copy-qr-image": copyQrImage(); break;
    case "download-qr": downloadQr(); break;
    case "copy-qr-link": copyQrLink(); break;
    case "open-site-form": e.stopPropagation(); openSiteForm(id||null); break;
    case "delete-site": e.stopPropagation(); deleteSite(id); break;
    case "add-tree-row":
      state.editingSite.trees.push({ type: TREE_TYPES[0], qty: 10, icon: DEFAULT_TREE_ICON });
      state.openIconPickerIdx = null;
      document.getElementById("treeRows").innerHTML = treeRowsHTML();
      break;
    case "remove-tree-row": {
      const idx = Number(t.dataset.idx);
      if(state.editingSite.trees.length>1){ state.editingSite.trees.splice(idx,1); state.openIconPickerIdx = null; document.getElementById("treeRows").innerHTML = treeRowsHTML(); }
      break;
    }
    case "toggle-icon-picker": {
      const idx = Number(t.dataset.idx);
      state.openIconPickerIdx = state.openIconPickerIdx===idx ? null : idx;
      document.getElementById("treeRows").innerHTML = treeRowsHTML();
      break;
    }
    case "pick-icon": {
      const idx = Number(t.dataset.idx);
      state.editingSite.trees[idx].icon = t.dataset.icon;
      state.openIconPickerIdx = null;
      document.getElementById("treeRows").innerHTML = treeRowsHTML();
      break;
    }
    case "add-maint-record": {
      const type = document.getElementById("f_newMaintType").value;
      const date = document.getElementById("f_newMaintDate").value || todayISO();
      state.editingMaintType = type;
      state.editingSite.maintenanceHistory.push({ type, date });
      document.getElementById("maintHistoryList").innerHTML = maintHistoryListHTML();
      toast("✅ Mantenimiento registrado");
      break;
    }
    case "remove-maint-record": {
      const idx = Number(t.dataset.idx);
      state.editingSite.maintenanceHistory.splice(idx,1);
      document.getElementById("maintHistoryList").innerHTML = maintHistoryListHTML();
      break;
    }
    case "delete-custom-icon": deleteCustomIcon(t.dataset.id); break;
    case "reset-demo": resetDemoData(); break;
    case "filter-status":
      state.filters.status = t.dataset.st;
      document.querySelectorAll("#fStatus button").forEach(b=>b.classList.toggle("active", b===t));
      renderMarkers();
      break;
    case "open-sheet-from-alert": openSheet(id); break;
  }
}

function onGlobalChange(e){
  const t = e.target;
  if(t.id==="iconUploadInput"){ if(t.files && t.files[0]) handleIconUpload(t.files[0]); t.value=""; }
  if(t.id==="fCorregimiento"){ state.filters.corregimiento = t.value; renderMarkers(); }
  if(t.id==="fTree"){ state.filters.treeType = t.value; renderMarkers(); }
  if(t.id==="chartTreeFilter"){ renderCorregimientoChart(); }
  if(t.dataset && t.dataset.action==="edit-tree-type"){
    state.editingSite.trees[Number(t.dataset.idx)].type = t.value;
  }
}

function onGlobalInput(e){
  const t = e.target;
  if(t.dataset && t.dataset.action==="edit-tree-qty"){
    state.editingSite.trees[Number(t.dataset.idx)].qty = t.value;
  }
  if(t.id==="siteSearchInput"){
    state.siteSearch = t.value;
    renderSitesTable();
  }
}

function onGlobalSubmit(e){
  const action = e.target.dataset ? e.target.dataset.action : null;
  if(action==="submit-site-form"){
    e.preventDefault();
    saveSiteForm();
  }
}

init();

</script>
</body>
</html>
